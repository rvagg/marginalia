<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>marginalia</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3/bundles/css/diff2html.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-light">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" id="hljs-dark" disabled>
  <link rel="stylesheet" href="/diff2html-theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="header">
  <span class="brand">marginalia</span>
  <span class="sep">&middot;</span>
  <span id="project-dir"></span>
  <span class="sep">&middot;</span>
  <span id="file-count"></span>
  <span class="sep">&middot;</span>
  <span id="status">connecting...</span>
  <button id="theme-toggle" title="Toggle dark mode"></button>
</header>

<main id="diff-container">
  <div id="loading-state">
    <div class="spinner"></div>
    <p>Connecting...</p>
  </div>
  <div id="empty-state" class="hidden">
    <p>No changes detected. Edit some files and they will appear here.</p>
  </div>
</main>

<div id="permission-bar" class="hidden">
  <span id="permission-text"></span>
  <button id="permission-approve" class="small">Approve</button>
  <button id="permission-deny" class="small secondary">Deny</button>
</div>

<footer id="chat-footer">
  <div id="chat-toggle">
    <span id="chat-indicator">+</span>
    <input type="text" id="general-input" placeholder="general comment...">
    <button id="general-send" class="small">Send</button>
  </div>
  <div id="chat-history" class="hidden"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/diff2html@3/bundles/js/diff2html.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff2html@3/bundles/js/diff2html-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@17/lib/marked.umd.js"></script>
<script src="/app.js"></script>

</body>
</html>
