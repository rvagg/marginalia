# Two jobs keep untrusted dependency analysis separate from the write token.
# pull_request_target runs this base-branch workflow, and no PR code is
# checked out or executed.
name: depsound
on:
  pull_request_target:

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: rvagg/depsound-action@e64e9937f8f5d7017446ce4f2375705e6c05a517 # v0.3.3
  post:
    needs: review
    if: ${{ always() && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      actions: read
    steps:
      - uses: rvagg/depsound-action/post@e64e9937f8f5d7017446ce4f2375705e6c05a517 # v0.3.3
